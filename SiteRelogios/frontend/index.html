<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Relógios</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Relógios</h1>

    <form id="form-relogio">
      <input type="text" id="marca" placeholder="Marca" required />
      <input type="text" id="modelo" placeholder="Modelo" required />
      <input type="number" id="preco" placeholder="Preço" required />
      <button type="submit">Cadastrar</button>
    </form>

    
    <div id="modal-editar" class="modal">
  <div class="modal-content">
    <h2>Editar Relógio</h2>
    <form id="form-editar">
      <input type="text" id="edit-marca" placeholder="Marca" required />
      <input type="text" id="edit-modelo" placeholder="Modelo" required />
      <input type="number" id="edit-preco" placeholder="Preço" required />
      <input type="hidden" id="edit-id" />
      <div class="modal-buttons">
        <button type="submit">Salvar</button>
        <button type="button" id="cancelar-edicao">Cancelar</button>
      </div>
    </form>
  </div>
</div>


    <div id="lista-relogios" class="lista"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
